<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Claude Code GUI</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <main class="container">
      <h1>Claude Code GUI</h1>
      <p class="hint">Send a prompt to the local Claude CLI wrapper.</p>
      <form id="chat-form">
        <textarea
          id="prompt"
          rows="6"
          placeholder="Ask Claude something about this project..."
          required
        ></textarea>
        <button id="send" type="submit">Send</button>
      </form>
      <section>
        <h2>Response</h2>
        <pre id="output"></pre>
      </section>
    </main>
    <script src="/app.js" type="module"></script>
  </body>
</html>
